name: ss-prod

services:
    redis:
        image: redis:7-alpine
        container_name: ss-redis-new
        restart: unless-stopped
        command: redis-server --save 60 1 --loglevel warning
        ports:
            - "6381:6379"
        volumes:
            - redis_data_new:/data
        networks:
            - ssnet_new
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    api:
        build:
            context: .
            dockerfile: Dockerfile
        image: ss-prod-api:latest
        container_name: ss-api-new
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
            scanner:
                condition: service_healthy
        env_file:
            - .env
        environment:
            NODE_ENV: production
            PORT: 8000
            MONGO_URL: ${MONGO_URL}
            REDIS_URL: redis://redis:6379
            QUEUE_BACKEND: bullmq
            SCANNER_SERVICE_URL: http://scanner:8001
        ports:
            - "8002:8000"
        networks:
            - ssnet_new
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e "require(''http'').get(''http://localhost:8000/healthz'', r => process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s

    worker:
        build:
            context: .
            dockerfile: Dockerfile.worker
        image: ss-prod-worker:latest
        container_name: ss-worker-new
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
            scanner:
                condition: service_healthy
        env_file:
            - .env
        environment:
            NODE_ENV: production
            MONGO_URL: ${MONGO_URL}
            REDIS_URL: redis://redis:6379
            QUEUE_BACKEND: bullmq
            SCANNER_SERVICE_URL: http://scanner:8001
        networks:
            - ssnet_new

    scanner:
        build:
            context: .
            dockerfile: Dockerfile.scanner
        image: ss-prod-scanner:latest
        container_name: ss-scanner-new
        restart: unless-stopped
        depends_on:
            redis:
                condition: service_healthy
        env_file:
            - .env
        environment:
            NODE_ENV: production
            SCANNER_PORT: 8001
            REDIS_URL: redis://redis:6379
        security_opt:
            - seccomp:unconfined
        ports:
            - "8003:8001"
        networks:
            - ssnet_new
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'node -e "require(''http'').get(''http://localhost:8001/healthz'', r => process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
                ]
            interval: 30s
            timeout: 15s
            retries: 3
            start_period: 30s

networks:
    ssnet_new:
        name: ssnet_new
        driver: bridge

volumes:
    redis_data_new:
        name: redis_data_new
        driver: local
